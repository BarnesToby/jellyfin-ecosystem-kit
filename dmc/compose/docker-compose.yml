version: "3.7"

networks:
  global:
    external: true
  local:
    external: false

services:
  transmission:
    image: lscr.io/linuxserver/transmission:latest
    restart: unless-stopped
    networks:
      - global
      - local
    environment:
      - PUID=${ENV_PUID}
      - PGID=${ENV_PGID}
      - TZ={TIMEZONE}
    volumes:
      - ${SERVICES_DIR}/transmission:/config
      - ${DOWNLOAD_DIR}:/downloads
    ports:
      - 51413:51413 # Torrent port TCP
      - 51413:51413/udp # Torrent port UDP
      - 9091:9091
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dmc-transmission.rule=Host(`${SUB_DOMAIN_TRANSMISSION}.${DOMAIN}`)"
      - "traefik.http.routers.dmc-transmission.tls=true"
      - "traefik.http.services.dmc-transmission.loadbalancer.server.port=9091"
      - "traefik.http.routers.dmc-transmission.tls.certresolver=letsencrypt"
      - "traefik.docker.network=global"
      # Basic auth
      - "traefik.http.middlewares.dmc-auth.basicauth.usersfile=/.htpasswd"
      - "traefik.http.routers.dmc-transmission.middlewares=dmc-auth"

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    restart: unless-stopped
    networks:
      - global
      - local
    environment:
      - PUID=${ENV_PUID}
      - PGID=${ENV_PGID}
      - TZ={TIMEZONE}
    volumes:
      - ${SERVICES_DIR}/radarr:/config
      - ${MOVIES_DIR}:/movies #optional
      - ${DOWNLOAD_DIR}:/downloads #optional
    ports:
      - 7878:7878
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dmc-radarr.rule=Host(`${SUB_DOMAIN_RADARR}.${DOMAIN}`)"
      - "traefik.http.routers.dmc-radarr.tls=true"
      - "traefik.http.services.dmc-radarr.loadbalancer.server.port=7878"
      - "traefik.http.routers.dmc-radarr.tls.certresolver=letsencrypt"
      - "traefik.docker.network=global"
      # Basic auth
      - "traefik.http.middlewares.dmc-auth.basicauth.usersfile=/.htpasswd"
      - "traefik.http.routers.dmc-radarr.middlewares=dmc-auth"

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    restart: unless-stopped
    #security_opt: # Required for Docker versions below 20.10.10, update Docker for long term solution. Source: https://docs.linuxserver.io/faq#jammy
    #  - seccomp=unconfined
    networks:
      - global
      - local
    environment:
      - PUID=${ENV_PUID}
      - PGID=${ENV_PGID}
      - TZ={TIMEZONE}
    volumes:
      - ${SERVICES_DIR}/sonarr:/config
      - ${TV_SHOWS_DIR}:/tv #optional
      - ${DOWNLOAD_DIR}:/downloads #optional
    ports:
      - 8989:8989
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dmc-sonarr.rule=Host(`${SUB_DOMAIN_SONARR}.${DOMAIN}`)"
      - "traefik.http.routers.dmc-sonarr.tls=true"
      - "traefik.http.services.dmc-sonarr.loadbalancer.server.port=8989"
      - "traefik.http.routers.dmc-sonarr.tls.certresolver=letsencrypt"
      - "traefik.docker.network=global"
      # Basic auth
      - "traefik.http.middlewares.dmc-auth.basicauth.usersfile=/.htpasswd"
      - "traefik.http.routers.dmc-sonarr.middlewares=dmc-auth"

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    restart: unless-stopped
    networks:
      - global
      - local
    environment:
      - PUID=${ENV_PUID}
      - PGID=${ENV_PGID}
      - TZ={TIMEZONE}
    volumes:
      - ${SERVICES_DIR}/prowlarr:/config
    ports:
      - 9696:9696
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dmc-prowlarr.rule=Host(`${SUB_DOMAIN_PROWLARR}.${DOMAIN}`)"
      - "traefik.http.routers.dmc-prowlarr.tls=true"
      - "traefik.http.services.dmc-prowlarr.loadbalancer.server.port=9696"
      - "traefik.http.routers.dmc-prowlarr.tls.certresolver=letsencrypt"
      - "traefik.docker.network=global"
      # Basic auth
      - "traefik.http.middlewares.dmc-auth.basicauth.usersfile=/.htpasswd"
      - "traefik.http.routers.dmc-prowlarr.middlewares=dmc-auth"

  jellyseerr:
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    restart: unless-stopped
    networks:
      - global
      - local
    environment:
      - LOG_LEVEL=debug
      - TZ={TIMEZONE}
    volumes:
      - ${SERVICES_DIR}/jellyseerr:/app/config
    ports:
      - 5055:5055
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dmc-jellyseerr.rule=Host(`${SUB_DOMAIN_JELLYSEERR}.${DOMAIN}`)"
      - "traefik.http.routers.dmc-jellyseerr.tls=true"
      - "traefik.http.services.dmc-jellyseerr.loadbalancer.server.port=5055"
      - "traefik.http.routers.dmc-jellyseerr.tls.certresolver=letsencrypt"
      - "traefik.docker.network=global"

  wizarr:
    image: ghcr.io/wizarrrr/wizarr:latest
    restart: unless-stopped
    networks:
      - global
      - local
    environment:
      - PUID=${ENV_PUID}
      - PGID=${ENV_PGID}
      - TZ=${TIMEZONE}
      - DISABLE_BUILTIN_AUTH=false
    volumes:
      - ${SERVICES_DIR}/wizarr:/data
    ports:
      - 5690:5690
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dmc-wizarr.rule=Host(`${SUB_DOMAIN_WIZARR}.${DOMAIN}`)"
      - "traefik.http.routers.dmc-wizarr.tls=true"
      - "traefik.http.routers.dmc-wizarr.tls.certresolver=letsencrypt"
      - "traefik.http.services.dmc-wizarr.loadbalancer.server.port=5690"
      - "traefik.docker.network=global"

  jellystat-db:
    image: postgres:15.2
    restart: unless-stopped
    shm_size: 1gb
    networks:
      - local
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${JELLYSTAT_POSTGRES_PASSWORD}
    volumes:
      - ${SERVICES_DIR}/jellystat/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --dbname=postgres --username=postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  jellystat:
    image: cyfershepard/jellystat:latest
    restart: unless-stopped
    networks:
      - global
      - local
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${JELLYSTAT_POSTGRES_PASSWORD}
      - POSTGRES_IP=jellystat-db
      - POSTGRES_PORT=5432
      - JWT_SECRET=${JELLYSTAT_JWT_SECRET}
      - TZ=${TIMEZONE}
    volumes:
      - ${SERVICES_DIR}/jellystat/backup:/app/backend/backup-data
    ports:
      - 3000:3000
    depends_on:
      jellystat-db:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dmc-jellystat.rule=Host(`${SUB_DOMAIN_JELLYSTAT}.${DOMAIN}`)"
      - "traefik.http.routers.dmc-jellystat.tls=true"
      - "traefik.http.routers.dmc-jellystat.tls.certresolver=letsencrypt"
      - "traefik.http.services.dmc-jellystat.loadbalancer.server.port=3000"
      - "traefik.docker.network=global"
